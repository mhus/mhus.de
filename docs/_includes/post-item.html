<li class="post-item">
  <a href="{{ include.post.url | relative_url }}">
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%d.%m.%Y" }}</time>
    <span class="post-title">{{ include.post.title }}</span>
    {%- if include.post.lang == "en" %}<span class="lang" title="Auf Englisch">EN</span>{% endif %}
  </a>
</li>
